<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Quiz Master</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: url("{{ url_for('static', filename='images/pexels-olly-3769714.jpg') }}") center/cover no-repeat;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.8);
        }

        .card-header {
            text-align: center;
            font-size: 1.8rem;
            font-weight: bold;
            color: white;
            background: linear-gradient(120deg, #007bff, #6610f2);
            border-radius: 15px 15px 0 0;
            padding: 20px;
        }

        .form-label {
            font-weight: 500;
        }

        .form-control {
            border-radius: 8px;
            border: 1px solid #ccc;
            padding: 10px;
            font-size: 1rem;
        }

        .btn-primary {
            background-color: #007bff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }

        .card-footer {
            background: none;
            text-align: center;
            padding: 15px;
        }

        .text-link {
            color: #007bff;
            font-weight: bold;
            text-decoration: none;
        }

        .text-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card">
                    <div class="card-header">
                        Create Your Account 🚀
                    </div>
                    <div class="card-body p-4">
                        <form action="/register" method="POST">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" name="email" id="email" class="form-control"
                                    placeholder="Enter your email" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" name="password" id="password" class="form-control"
                                    placeholder="Enter your password" required>
                            </div>
                            <div class="mb-3">
                                <label for="Fullname" class="form-label">Full Name</label>
                                <input type="text" name="name" id="Fullname" class="form-control"
                                    placeholder="Enter your full name" required>
                            </div>
                            <div class="mb-3">
                                <label for="Qualification" class="form-label">Qualification</label>
                                <input type="text" name="Qyalification" id="Qualification" class="form-control"
                                    placeholder="Enter your qualification" required>
                            </div>
                            <div class="mb-3">
                                <label for="Birthday" class="form-label">Date of Birth</label>
                                <input type="date" name="DOB" id="Birthday" class="form-control" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">Register</button>
                            </div>
                            <p class="text-center text-danger mt-3">{{message}}</p>
                        </form>
                    </div>
                    <div class="card-footer">
                        <small>Already have an account? <a href="/login" class="text-link">Login</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
