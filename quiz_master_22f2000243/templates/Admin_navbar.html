<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subjects and Chapters</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: url("{{ url_for('static', filename='images/pexels-olly-3769714.jpg') }}") center/cover no-repeat;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .navbar-custom {
      background-color: #918fb0;
    }

    .card-header {
      background-color: #d1ecf1;
      font-weight: bold;
    }

    .add-chapter-btn {
      background-color: #f8d7da;
      border: 1px solid #f5c6cb;
      color: #721c24;
    }

    .add-chapter-btn:hover {
      background-color: #f5c6cb;
    }

    img {
      max-width: 80%;
      height: auto;
      border: 2px solid #333;
      box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.2);
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light navbar-custom">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Navbar</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
        aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
        <div class="navbar-nav">
          <a class="nav-link active" aria-current="page" href="/admin/{{name}}">Home</a>
          <a class="nav-link" href="/quiz/{{name}}">Quiz</a>
          <a class="nav-link" href="/admin_summery/{{name}}">Summary</a>
          <a class="nav-link" href="/login">Logout</a>
        </div>
      </div>
      <form class="d-flex ms-auto" method="POST" action="/search/{{name}}">
        <input class="form-control me-2" type="search" name="search_txt" placeholder="Search" aria-label="Search">
        <button class="btn btn-outline-primary" type="submit">Search</button>
      </form>
      <span class="navbar-text ms-3">Welcome {{name}}</span>
    </div>
  </nav>
  {%block content%}

  {%endblock%}
</body>

</html>
