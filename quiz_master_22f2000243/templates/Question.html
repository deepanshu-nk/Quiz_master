<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Question</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="container mt-4">

    <h2 class="text-center">Add Question for Quiz</h2>

    <form method="POST">
        <div class="mb-3">
            <label for="question_title" class="form-label">Chapter Id</label>
            <input type="text" class="form-control" id="question_title" name="chapter_id" value="{{chapter_id}}"
                readonly>
        </div>

        <div class="mb-3">
            <label for="question_title" class="form-label">Chapter Name</label>
            <input type="text" class="form-control" id="question_title" name="Chapter_name" value="{{chapter_name}}"
                readonly>
        </div>

        <div class="mb-3">
            <label for="question_title" class="form-label">Question Topics</label>
            <input type="text" class="form-control" id="question_title" name="question_title" required>
        </div>

        <div class="mb-3">
            <label for="question_statement" class="form-label">Question Statement</label>
            <textarea class="form-control" id="question_statement" name="question_statement" rows="3"
                required></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Options</label>
            <input type="text" class="form-control mb-2" name="option1" placeholder="Option 1" required>
            <input type="text" class="form-control mb-2" name="option2" placeholder="Option 2" required>
            <input type="text" class="form-control mb-2" name="option3" placeholder="Option 3" required>
            <input type="text" class="form-control mb-2" name="option4" placeholder="Option 4" required>
        </div>

        <div class="mb-3">
            <label for="correct_option" class="form-label">Correct Option (1-4)</label>
            <input type="text" class="form-control" id="correct_option" name="correct_option" required>
        </div>

        <button type="submit" class="btn btn-primary">Save Question</button>
        <a href="/quiz" class="btn btn-secondary">Cancel</a>
    </form>

</body>

</html>
