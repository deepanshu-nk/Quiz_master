<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Course</title>
    <!-- Link to Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
        }

        .form-container {
            width: 400px;
            background: #fff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .form-container h2 {
            text-align: center;
            color: #ff6600;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .form-container label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form-container input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
        }

        .note {
            font-size: 0.9rem;
            color: #e74c3c;
            text-align: center;
            margin-bottom: 15px;
        }

        .button-group {
            display: flex;
            justify-content: space-between;
        }

        .button-group a {
            width: 30%;
            padding: 10px;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
            font-size: 1rem;
        }

        .btn-save {
            background-color: #007bff;
            color: #fff;
        }

        .btn-delete {
            background-color: #e74c3c;
            color: #fff;
        }

        .btn-cancel {
            background-color: #6c757d;
            color: #fff;
        }

        .btn-cancel:hover {
            background-color: #5a6268;
        }
    </style>
</head>

<body>
    {% if cour %}
    <div class="form-container">
        <h2>Edit Course</h2>
        <form action=" " method="POST">
            <!-- Name Input -->
            <label for="name">Name:</label>
            <input type="text" id="name" name="course_name" value="{{ cour.course_name }}">

            <!-- Description Input -->
            <label for="description">Description:</label>
            <input type="text" id="description" name="description" value="{{ cour.description }}">

            <!-- Note -->
            <p class="note">{{ message }}</p>

            <!-- Buttons -->
            <div class="button-group">
                <a href="#" onclick="this.closest('form').submit();" class="btn-save">Save</a>
                <a href="/delete_course/{{cour.id}}/{{name}}" class="btn-delete"
                    onclick="return confirm('Are you sure you want to delete this course?');">
                    Delete
                </a>
                <a href="/admin/{{name}}" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
    {%endif%}
</body>

</html>
