<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: url("{{ url_for('static', filename='images/pexels-olly-3769714.jpg') }}") center/cover no-repeat;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .navbar {
            background-color: #d6eaf8;
            padding: 10px;
            border-radius: 10px;
        }

        .nav-link {
            font-weight: bold;
            color: #117a8b;
        }

        .dashboard-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }

        .btn-view {
            background-color: #3498db;
            color: white;
        }

        .btn-start {
            background-color: #2ecc71;
            color: white;
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <div class="container mt-3">
        <nav class="navbar navbar-expand-lg">
            <a class="navbar-brand fw-bold text-primary">Quizify</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/user/{{name}}">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/scores/{{name}}">Scores</a></li>
                    <li class="nav-item"><a class="nav-link" href="/user_summery/{{name}}">Summary</a></li>
                    <li class="nav-item"><a class="nav-link" href="/login">Logout</a></li>
                </ul>
                <form class="d-flex">
                    <input class="form-control me-2" type="search" placeholder="Search">
                    <button class="btn btn-outline-primary" type="submit">Search</button>
                </form>
                <span class="ms-3 fw-bold text-primary">Welcome {{name}}</span>
            </div>
        </nav>
    </div>

    <h2>Chapter vs. Questions</h2>
    <p>This graph represents the Merks of the Each Quiz.</p>

    <!-- Display the saved graph image -->
    <img src="{{ url_for('static', filename='images/user_summery.png') }}" alt="Chapter Summary Graph">



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
