<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Quiz</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="container mt-4">

    <h2 class="text-center">Add New Quiz for {{ chapter.Chapter_name }}</h2>

    <form method="POST">
        <div class="mb-3">
            <label for="quiz_date" class="form-label">Quiz Date</label>
            <input type="date" class="form-control" id="quiz_date" name="quiz_date" required>
        </div>

        <div class="mb-3">
            <label for="time_duration" class="form-label">Duration (hh:mm)</label>
            <input type="time" class="form-control" id="time_duration" name="time_duration">
        </div>

        <div class="mb-3">
            <label for="feedback" class="form-label">Feedback</label>
            <textarea class="form-control" id="feedback" name="feedback" rows="3" required></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Save Quiz</button>
        <a href="/quiz" class="btn btn-secondary">Cancel</a>
        {{msg}}
    </form>

</body>

</html>
