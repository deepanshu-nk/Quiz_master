<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <div class="card p-4 shadow">
            <h3 class="text-center mb-4">Quiz Questions</h3>

            <form action=" " method="POST">
                {% if questions %}
                {% for question in questions %}
                <div class="mb-4">
                    <h5>({{ question.id }}) {{ question.question_statement }}</h5>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="question_{{ question.id }}"
                            value="{{ question.option_1 }}" id="q{{ question.id }}_1">
                        <label class="form-check-label" for="q{{ question.id }}_1">{{ question.option_1 }}</label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="question_{{ question.id }}"
                            value="{{ question.option_2 }}" id="q{{ question.id }}_2">
                        <label class="form-check-label" for="q{{ question.id }}_2">{{ question.option_2 }}</label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="question_{{ question.id }}"
                            value="{{ question.option_3 }}" id="q{{ question.id }}_3">
                        <label class="form-check-label" for="q{{ question.id }}_3">{{ question.option_3 }}</label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="question_{{ question.id }}"
                            value="{{ question.option_4 }}" id="q{{ question.id }}_4">
                        <label class="form-check-label" for="q{{ question.id }}_4">{{ question.option_4 }}</label>
                    </div>
                </div>
                {% endfor %}

                <button type="submit" class="btn btn-primary mt-3">Submit Quiz</button>
                <a href="/user/{{name}}" class="btn btn-secondary mt-3 ms-2">Cancel</a>
                {% else %}
                <p class="text-center text-muted">No questions available for this quiz.</p>
                {% endif %}
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
