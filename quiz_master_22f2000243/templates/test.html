<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizify | Home</title>
    <style>
        /* General Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f4;
            text-align: center;
        }

        /* Navbar */
        .navbar {
            background: #333;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px;
        }

        .navbar h1 {
            font-size: 24px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 18px;
            transition: 0.3s;
        }

        .navbar a:hover {
            color: #ffcc00;
        }

        /* Hero Section */
        .hero {
            background: url("{{ url_for('static', filename='images/pexels-olly-3769714.jpg') }}") center/cover no-repeat;
            height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.7);
        }

        .hero h1 {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 20px;
            margin-bottom: 20px;
        }

        .btn {
            background: #ffcc00;
            color: black;
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            border-radius: 5px;
            text-decoration: none;
        }

        .btn:hover {
            background: #ff9900;
        }

        /* Footer */
        .footer {
            background: #333;
            color: white;
            padding: 15px;
            font-size: 16px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <div class="navbar">
        <h1>Quizify</h1>
        <div>
            <a href="/login">Home</a>
            <a href="/login">Quizzes</a>
            <a href="/login">Leaderboard</a>
            <a href="/login">Contact</a>
        </div>
    </div>

    <!-- Hero Section -->
    <div class="hero">
        <h1>Welcome to Quiz Master</h1>
        <p>Test your knowledge and challenge your friends!</p>
        <a href="/login" class="btn">Singnup</a>
    </div>

    <!-- Footer -->
    <div class="footer">
        <p>&copy; 2025 Quiz Master | All rights reserved</p>
    </div>

</body>

</html>
