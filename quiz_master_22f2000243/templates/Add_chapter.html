<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter Form</title>
    <!-- Link to Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: url("{{ url_for('static', filename='images/pexels-olly-3769714.jpg') }}") center/cover no-repeat;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
        }

        .form-container {
            width: 400px;
            background: #fff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .form-container h2 {
            text-align: center;
            color: #ff6600;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .form-container label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form-container input,
        .form-container textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
        }

        .form-container textarea {
            resize: none;
        }

        .note {
            font-size: 0.9rem;
            color: #e74c3c;
            text-align: center;
            margin-bottom: 15px;
        }

        .button-group {
            display: flex;
            justify-content: space-between;
        }

        .button-group .btn {
            width: 48%;
            padding: 10px;
            font-size: 1rem;
        }
    </style>
</head>

<body>
    <div class="form-container">
        <h2>Chapter</h2>
        <form action="/add_chapter/{{course_id}}/{{course_name}}/{{name}}" method="POST" enctype="multipart/form-data">
            <!-- Course ID -->
            <label for="course_id">Course ID</label>
            <input type="number" id="course_id" name="course_id" value="{{course_id}}" readonly>

            <!-- Course Name -->
            <label for="Chapter_name">Course Name</label>
            <input type="text" id="Chapter_name" name="Chapter_name" value="{{course_name}}" readonly>

            <!-- Chapter Name -->
            <label for="chapter_name">Chapter</label>
            <input type="text" id="chapter_name" name="Chapter_names" placeholder="Enter Chapter name">

            <!-- Topics -->
            <label for="topics">Topics</label>
            <input type="text" id="topics" name="Topics" placeholder="Enter Topics name">

            <!-- Total Questions -->
            <label for="questions">Total Questions</label>
            <input type="text" id="questions" name="Questions" placeholder="Enter number of Questions">

            <!-- Note -->
            <p class="note">{{message}}</p>

            <!-- Buttons -->
            <div class="button-group">
                <button type="submit" class="btn btn-primary">Save</button>
                <a href="/admin/{{name}}" class="btn btn-primary">Close</a>
            </div>
        </form>
    </div>
</body>

</html>
