<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chapter form</title>
    <!-- Link to Google Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
        }

        .form-container {
            width: 400px;
            background: #fff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .form-container h2 {
            text-align: center;
            color: #ff6600;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .form-container label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form-container input,
        .form-container textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
        }

        .form-container textarea {
            resize: none;
        }

        .note {
            font-size: 0.9rem;
            color: #e74c3c;
            text-align: center;
            margin-bottom: 15px;
        }

        .button-group {
            display: flex;
            justify-content: space-between;
        }

        .button-group button {
            width: 48%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
        }

        .button-group .btn-save {
            background-color: #007bff;
            color: #fff;
        }

        .button-group .btn-cancel {
            background-color: #f0f0f0;
            color: #000;
        }

        .button-group .btn-cancel:hover {
            background-color: #e0e0e0;
        }
    </style>
</head>

<body>
    {%if chapter%}
    <div class="form-container">
        <h2>Edit chapter</h2>
        <form action="" method="POST">
            <!-- Course Name -->
            <label for="name">chapter name</label>
            <input type="string" id="Chapter_name" name="Chapter_name" value="{{chapter.Chapter_name}}">

            <!-- Name Input -->
            <label for="name">Topics</label>
            <input type="string" id="name" name="Topics" value="{{chapter.Topics}}">

            <!--Number of Question-->
            <label for="name">Total Questions</label>
            <input type="integer" id="name" name="Question" value="{{chapter.Question}}">

            <!-- Note -->
            <p class="note">{{message}}</p>

            <!-- Buttons -->
            <div class="button-group">
                <button type="submit" class="btn-save">Save</button>
                <button type="cancel" class="btn-cancel">Cancel</button>
            </div>
        </form>
    </div>
    {%endif%}
</body>

</html>
